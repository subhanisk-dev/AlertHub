upstream alerthub_backend {
    server backend:5000;
    keepalive 32;
}

map $http_x_forwarded_proto $alerthub_forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

# Apply request limits by the original client address forwarded by the trusted Caddy proxy.
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 9m;

    include /etc/nginx/snippets/security-headers.conf;

    # Keep API routes on the public frontend origin while Flask remains on the private network.
    location /api/ {
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_pass http://alerthub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $alerthub_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # Slow repeated login and registration attempts before they reach password hashing.
    location = /api/auth/login {
        limit_req zone=auth_per_ip burst=5 nodelay;
        proxy_pass http://alerthub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $alerthub_forwarded_proto;
        proxy_read_timeout 30s;
    }

    location = /api/auth/register {
        limit_req zone=auth_per_ip burst=5 nodelay;
        proxy_pass http://alerthub_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $alerthub_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # Upgrade Socket.IO polling or WebSocket connections and allow live sessions to stay open.
    location /socket.io/ {
        proxy_pass http://alerthub_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $alerthub_forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }

    # Cache fingerprinted Vite assets for a year while retaining common security headers.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Avoid stale application shells after a new version is deployed.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Let service-worker updates and application metadata become visible immediately.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Serve React routes such as /status through the single-page application entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
