name: alerthub

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      MYSQL_DATABASE: ${DB_NAME:-alerthub}
      MYSQL_USER: ${MIGRATION_DB_USER:-alerthub_migrator}
      MYSQL_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD in .env.production}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env.production}
      MYSQL_RUNTIME_PASSWORD: ${MYSQL_RUNTIME_PASSWORD:?Set MYSQL_RUNTIME_PASSWORD in .env.production}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Database/docker-runtime-user.sh:/docker-entrypoint-initdb.d/02-runtime-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  migrate:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    restart: "no"
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MIGRATION_DB_USER:-alerthub_migrator}
      DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD in .env.production}
      DB_NAME: ${DB_NAME:-alerthub}
    command: ["python", "migrate_database.py"]
    depends_on:
      db:
        condition: service_healthy

  key-init:
    image: alpine:3.22
    restart: "no"
    volumes:
      - ./secrets/vapid_private.pem:/source/vapid_private.pem:ro
      - vapid_key:/target
    command:
      - sh
      - -c
      - install -m 0400 -o 10001 -g 10001 /source/vapid_private.pem /target/vapid_private_key

  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      FLASK_DEBUG: "0"
      HOST: 0.0.0.0
      PORT: 5000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in .env.production}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: alerthub_runtime
      DB_PASSWORD: ${MYSQL_RUNTIME_PASSWORD:?Set MYSQL_RUNTIME_PASSWORD in .env.production}
      DB_NAME: ${DB_NAME:-alerthub}
      UPLOAD_DIR: /var/lib/alerthub/uploads
      VAPID_PRIVATE_KEY: /run/secrets/vapid_private_key
    volumes:
      - uploads:/var/lib/alerthub/uploads
      - vapid_key:/run/secrets:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      key-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  mysql_data:
  uploads:
  vapid_key:
  caddy_data:
  caddy_config:
